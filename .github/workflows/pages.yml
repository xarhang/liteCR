name: Documentation Pages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish documentation from the default branch (requires Pages enabled)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -r tools/docs/requirements.txt
      - name: Build and validate all local links
        run: python tools/docs/build_site.py --output target/docs-site
      - name: Exercise the site under a project URL
        run: python tools/docs/check_site.py --directory target/docs-site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/docs-site

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
