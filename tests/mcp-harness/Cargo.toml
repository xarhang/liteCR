[package]
name = "litecr-mcp-synthetic-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "=1.1.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.152"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
