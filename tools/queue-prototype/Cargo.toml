[workspace]
resolver = "3"
members = ["."]

[package]
name = "litecr-queue-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
apalis = { version = "=0.7.4", features = ["retry"] }
apalis-sql = { version = "=0.7.4", default-features = false, features = ["migrate", "postgres", "tokio-comp"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["fmt", "env-filter"] }
